name: Public web quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-web:
    name: Web contracts, production interactions and release boundary
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AUDIT_ROOT: /tmp/naturehike-web-ci-audit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.10.12"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - run: uv sync --locked --python 3.12
      - run: |
          uv run python scripts/build_data.py
          uv run python scripts/export_web.py
      - run: npm install --global npm@10.9.2
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm audit
          npm run build
          npx playwright install --with-deps chromium webkit firefox
          npm run test:e2e
      - run: uv run python scripts/verify_web_release.py --artifact web/out
      - name: Scan exact hosting artifact
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" dir --redact web/out
      # No private audit, source capture, trace or deployment upload.
