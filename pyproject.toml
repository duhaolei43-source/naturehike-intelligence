[project]
name = "naturehike-intel"
version = "0.1.0"
description = "Independent, evidence-driven backpacking tent market research"
requires-python = ">=3.12,<3.13"
dependencies = ["polars>=1.35,<2", "pydantic>=2.12,<3", "duckdb>=1.4,<2", "pandera[polars]>=0.26,<1", "scipy>=1.16,<2", "plotly>=6.3,<7", "streamlit>=1.50,<2", "pyyaml>=6,<7", "cryptography>=46,<47"]
[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "sqlfluff>=3.4,<4", "pre-commit>=4.3,<5"]
[project.scripts]
naturehike-intel = "naturehike_intel.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/naturehike_intel"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
